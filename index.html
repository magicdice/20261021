<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <title>智慧課堂助手</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tools/draw.css">
  <link rel="stylesheet" href="css/tools/clock.css">
  <link rel="stylesheet" href="css/tools/timer.css">
  <link rel="stylesheet" href="css/tools/score.css">
  <link rel="stylesheet" href="css/tools/board.css">
  <link rel="stylesheet" href="css/tools/irs.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/draw.js"></script>
  <script defer src="js/tools/clock.js"></script>
  <script defer src="js/tools/timer.js"></script>
  <script defer src="js/tools/score.js"></script>
  <script defer src="js/tools/board.js"></script>
  <script defer src="js/tools/irs.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#draw" aria-label="智慧課堂助手首頁">
        <span class="brand-mark" aria-hidden="true">課</span>
        <span>
          <strong>智慧課堂助手</strong>
          <small>六個課堂工具，一個工作空間</small>
        </span>
      </a>
      <div class="header-controls">
        <p class="header-note">選擇工具開始使用</p>
        <label class="theme-control" data-theme-preference="system">
          <span class="visually-hidden">選擇色彩主題</span>
          <select id="theme-select" aria-label="選擇色彩主題">
            <option value="system">跟隨系統</option>
            <option value="light">淺色</option>
            <option value="dark">深色</option>
          </select>
          <svg class="theme-icon theme-icon-system" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="4" width="17" height="12" rx="2"></rect>
            <path d="M8 20h8m-4-4v4"></path>
          </svg>
          <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
          </svg>
          <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"></path>
          </svg>
        </label>
      </div>
    </header>
    <div class="navigation-dock" id="navigation-dock" data-expanded="false">
      <button
        class="navigation-toggle"
        id="navigation-toggle"
        type="button"
        aria-label="開啟課堂工具"
        aria-controls="tool-navigation"
        aria-expanded="false"
      >
        <svg class="navigation-open-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="3.5" width="6" height="6" rx="1"></rect>
          <rect x="14.5" y="3.5" width="6" height="6" rx="1"></rect>
          <rect x="3.5" y="14.5" width="6" height="6" rx="1"></rect>
          <rect x="14.5" y="14.5" width="6" height="6" rx="1"></rect>
        </svg>
        <svg class="navigation-close-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
      </button>
      <nav class="tool-navigation" id="tool-navigation" aria-label="課堂工具" role="tablist"></nav>
    </div>
    <main id="tool-panels" class="tool-panels"></main>
    <p id="app-status" class="app-status" role="status" aria-live="polite"></p>
  </div>
</body>
</html>
