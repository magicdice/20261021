<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101411">
  <title>課堂無限白板</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --panel: rgba(25, 31, 28, .91);
      --border: rgba(255, 255, 255, .14);
      --muted: #aab5ae;
      --accent: #73e0aa;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101411;
    }

    body { overscroll-behavior: none; }

    #board {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
      cursor: crosshair;
    }

    #board.cursor-pan { cursor: grab; }
    #board.cursor-panning { cursor: grabbing; }
    #board.cursor-eraser { cursor: cell; }

    .toolbar {
      position: fixed;
      z-index: 2;
      top: 18px;
      left: 18px;
      width: min(272px, calc(100vw - 36px));
      max-height: calc(100dvh - 36px);
      overflow-y: auto;
      padding: 14px;
      color: #f2f7f3;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform .2s ease, opacity .2s ease;
    }

    .toolbar.collapsed {
      transform: translateX(calc(-100% - 24px));
      opacity: 0;
      pointer-events: none;
    }

    .toolbar h1 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .section-label {
      display: block;
      margin: 14px 0 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    button, input { font: inherit; }

    .tool-button, .action-button, .collapse-button {
      min-height: 44px;
      color: #eef5f0;
      background: rgba(255, 255, 255, .07);
      border: 1px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }

    .tool-button {
      display: grid;
      place-items: center;
      padding: 5px;
      font-size: 19px;
    }

    .tool-button span {
      margin-top: 1px;
      font-size: 10px;
      line-height: 1.1;
    }

    .tool-button:hover, .action-button:hover, .collapse-button:hover {
      background: rgba(255, 255, 255, .14);
    }

    .tool-button.active {
      color: #101b14;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(115, 224, 170, .2);
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
    }

    .color-button {
      width: 38px;
      height: 38px;
      justify-self: center;
      padding: 0;
      border: 3px solid rgba(255, 255, 255, .18);
      border-radius: 50%;
      cursor: pointer;
      touch-action: manipulation;
    }

    .color-button.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px var(--accent);
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    #width-value {
      min-width: 36px;
      color: #f4f8f5;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      font-size: 14px;
    }

    .toggle-row input {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .action-button {
      padding: 8px 6px;
      font-size: 13px;
    }

    .action-button.danger { color: #ffaaa3; }
    .action-button.primary { color: var(--accent); }

    .toolbar-toggle {
      position: fixed;
      z-index: 3;
      top: 18px;
      left: 18px;
      transition: left .2s ease;
    }

    .toolbar-toggle.is-collapsed { left: 14px; }

    .collapse-button {
      width: 44px;
      height: 44px;
      font-size: 20px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .toolbar:not(.collapsed) ~ .toolbar-toggle {
      left: 252px;
    }

    #status {
      position: fixed;
      right: 16px;
      bottom: 14px;
      max-width: calc(100vw - 32px);
      padding: 8px 12px;
      color: #d5dfd8;
      background: rgba(20, 26, 22, .76);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .toolbar {
        top: auto;
        bottom: 12px;
        left: 12px;
        width: min(272px, calc(100vw - 24px));
        max-height: min(68dvh, 560px);
      }

      .toolbar.collapsed {
        transform: translateX(calc(-100% - 18px));
      }

      .toolbar-toggle {
        top: auto;
        bottom: 12px;
        left: 12px;
      }

      .toolbar:not(.collapsed) ~ .toolbar-toggle {
        left: min(252px, calc(100vw - 58px));
      }

      .toolbar-toggle.is-collapsed { left: 12px; }

      #status {
        right: 12px;
        bottom: 12px;
        max-width: calc(100vw - 300px);
        text-align: right;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="board" aria-label="課堂無限白板"></canvas>

  <aside class="toolbar" id="toolbar" aria-label="白板工具列">
    <h1>課堂無限白板</h1>

    <span class="section-label">工具</span>
    <div class="tool-grid" role="group" aria-label="繪圖工具">
      <button class="tool-button active" type="button" data-tool="pen" aria-label="粉筆筆" title="粉筆筆">✎<span>粉筆</span></button>
      <button class="tool-button" type="button" data-tool="eraser" aria-label="橡皮擦" title="橡皮擦">▱<span>橡皮擦</span></button>
      <button class="tool-button" type="button" data-tool="pan" aria-label="平移畫布" title="平移畫布">✋<span>平移</span></button>
      <button class="tool-button" type="button" data-tool="line" aria-label="直線" title="直線">╱<span>直線</span></button>
      <button class="tool-button" type="button" data-tool="rect" aria-label="矩形" title="矩形">▢<span>矩形</span></button>
      <button class="tool-button" type="button" data-tool="circle" aria-label="圓形" title="圓形">◯<span>圓形</span></button>
    </div>

    <span class="section-label">粉筆顏色</span>
    <div class="color-grid" role="group" aria-label="筆刷顏色">
      <button class="color-button active" type="button" data-color="#f4f6ef" aria-label="白色" title="白色" style="background:#f4f6ef"></button>
      <button class="color-button" type="button" data-color="#ff5d62" aria-label="紅色" title="紅色" style="background:#ff5d62"></button>
      <button class="color-button" type="button" data-color="#ffe45e" aria-label="黃色" title="黃色" style="background:#ffe45e"></button>
      <button class="color-button" type="button" data-color="#65ed91" aria-label="綠色" title="綠色" style="background:#65ed91"></button>
      <button class="color-button" type="button" data-color="#62baff" aria-label="藍色" title="藍色" style="background:#62baff"></button>
    </div>

    <label class="section-label" for="brush-width">筆刷粗細</label>
    <div class="range-row">
      <input id="brush-width" type="range" min="2" max="24" value="6">
      <output id="width-value" for="brush-width">6 px</output>
    </div>

    <label class="toggle-row" for="grid-toggle">
      <span>背景格線</span>
      <input id="grid-toggle" type="checkbox">
    </label>

    <div class="action-grid">
      <button class="action-button" id="undo-button" type="button" title="復原（Ctrl/Cmd+Z）">↶ 復原</button>
      <button class="action-button danger" id="clear-button" type="button">清除全部</button>
      <button class="action-button primary" id="download-button" type="button">下載圖片</button>
      <button class="action-button" id="zoom-reset-button" type="button" title="重設視角">重設視角</button>
    </div>
  </aside>

  <div class="toolbar-toggle">
    <button class="collapse-button" id="collapse-button" type="button" aria-label="收合工具列" title="收合工具列">‹</button>
  </div>
  <div id="status" role="status" aria-live="polite">空白鍵平移 · 滾輪／雙指縮放</div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "classroom-infinite-whiteboard-v1";
      const BACKGROUND = "#17211b";
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d", { alpha: false });
      const strokesCanvas = document.createElement("canvas");
      const strokesCtx = strokesCanvas.getContext("2d");
      const toolbar = document.getElementById("toolbar");
      const status = document.getElementById("status");
      const colorButtons = [...document.querySelectorAll(".color-button")];
      const toolButtons = [...document.querySelectorAll(".tool-button")];
      const widthInput = document.getElementById("brush-width");
      const widthValue = document.getElementById("width-value");
      const gridToggle = document.getElementById("grid-toggle");
      const pointers = new Map();

      let paths = [];
      let currentTool = "pen";
      let color = "#f4f6ef";
      let lineWidth = 6;
      let gridEnabled = false;
      let offsetX = 0;
      let offsetY = 0;
      let scale = 1;
      let dpr = 1;
      let drawingPath = null;
      let interaction = null;
      let pinchState = null;
      let spaceDown = false;
      let saveTimer = 0;
      let statusTimer = 0;

      function setStatus(message, temporary = false) {
        status.textContent = message;
        window.clearTimeout(statusTimer);
        if (temporary) {
          statusTimer = window.setTimeout(() => {
            status.textContent = "空白鍵平移 · 滾輪／雙指縮放";
          }, 2800);
        }
      }

      function scheduleSave() {
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(saveState, 120);
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            version: 1,
            paths,
            preferences: { tool: currentTool, color, lineWidth, gridEnabled }
          }));
        } catch (error) {
          setStatus("無法保存白板資料；請下載圖片備份。", true);
          console.error("白板資料保存失敗：", error);
        }
      }

      function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        try {
          const saved = JSON.parse(raw);
          if (saved.version !== 1 || !Array.isArray(saved.paths)) {
            throw new Error("白板資料格式不相容");
          }
          paths = saved.paths.filter(path =>
            path && ["pen", "eraser", "line", "rect", "circle"].includes(path.tool) &&
            typeof path.color === "string" && Number.isFinite(path.lineWidth) &&
            Array.isArray(path.points) && path.points.every(point =>
              Number.isFinite(point.x) && Number.isFinite(point.y))
          );
          const preferences = saved.preferences || {};
          if (["pen", "eraser", "pan", "line", "rect", "circle"].includes(preferences.tool)) currentTool = preferences.tool;
          if (colorButtons.some(button => button.dataset.color === preferences.color)) color = preferences.color;
          if (Number.isFinite(preferences.lineWidth)) lineWidth = Math.min(24, Math.max(2, preferences.lineWidth));
          gridEnabled = Boolean(preferences.gridEnabled);
        } catch (error) {
          console.error("無法讀取白板資料：", error);
          setStatus("保存資料無法讀取，已使用空白畫布。", true);
          paths = [];
        }
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        strokesCanvas.width = canvas.width;
        strokesCanvas.height = canvas.height;
        redraw();
      }

      function drawGrid(width, height) {
        const spacing = 40;
        const left = -offsetX / scale;
        const top = -offsetY / scale;
        const right = (width - offsetX) / scale;
        const bottom = (height - offsetY) / scale;
        const startX = Math.floor(left / spacing) * spacing;
        const startY = Math.floor(top / spacing) * spacing;

        ctx.save();
        ctx.beginPath();
        ctx.strokeStyle = "rgba(211, 232, 216, 0.12)";
        ctx.lineWidth = 1 / scale;
        for (let x = startX; x <= right; x += spacing) {
          ctx.moveTo(x, top);
          ctx.lineTo(x, bottom);
        }
        for (let y = startY; y <= bottom; y += spacing) {
          ctx.moveTo(left, y);
          ctx.lineTo(right, y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawPath(path, context) {
        const points = path.points;
        if (!points.length) return;
        context.save();
        context.globalCompositeOperation = path.tool === "eraser" ? "destination-out" : "source-over";
        context.strokeStyle = path.color;
        context.fillStyle = path.color;
        context.lineWidth = path.tool === "eraser" ? path.lineWidth * 3 : path.lineWidth;
        context.lineCap = "round";
        context.lineJoin = "round";
        context.beginPath();

        if (path.tool === "line") {
          if (points.length > 1) {
            context.moveTo(points[0].x, points[0].y);
            context.lineTo(points[points.length - 1].x, points[points.length - 1].y);
          }
        } else if (path.tool === "rect") {
          if (points.length > 1) {
            const first = points[0];
            const last = points[points.length - 1];
            context.rect(first.x, first.y, last.x - first.x, last.y - first.y);
          }
        } else if (path.tool === "circle") {
          if (points.length > 1) {
            const first = points[0];
            const last = points[points.length - 1];
            const radius = Math.hypot(last.x - first.x, last.y - first.y);
            context.arc(first.x, first.y, radius, 0, Math.PI * 2);
          }
        } else if (points.length === 1) {
          context.arc(points[0].x, points[0].y, context.lineWidth / 2, 0, Math.PI * 2);
          context.fill();
        } else {
          context.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            context.lineTo(points[i].x, points[i].y);
          }
        }

        if (path.tool !== "pen" || points.length > 1) context.stroke();
        context.restore();
      }

      function redraw() {
        const width = canvas.width / dpr;
        const height = canvas.height / dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = BACKGROUND;
        ctx.fillRect(0, 0, width, height);
        if (gridEnabled) {
          ctx.save();
          ctx.translate(offsetX, offsetY);
          ctx.scale(scale, scale);
          drawGrid(width, height);
          ctx.restore();
        }
        strokesCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        strokesCtx.clearRect(0, 0, width, height);
        strokesCtx.save();
        strokesCtx.translate(offsetX, offsetY);
        strokesCtx.scale(scale, scale);
        for (const path of paths) drawPath(path, strokesCtx);
        if (drawingPath) drawPath(drawingPath, strokesCtx);
        strokesCtx.restore();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(strokesCanvas, 0, 0);
      }

      function screenPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      function worldPoint(point) {
        return { x: (point.x - offsetX) / scale, y: (point.y - offsetY) / scale };
      }

      function setActiveTool(tool) {
        currentTool = tool;
        toolButtons.forEach(button => button.classList.toggle("active", button.dataset.tool === tool));
        updateCursor();
        scheduleSave();
      }

      function updateCursor() {
        canvas.classList.toggle("cursor-pan", currentTool === "pan" || spaceDown);
        canvas.classList.toggle("cursor-eraser", currentTool === "eraser" && !spaceDown);
        canvas.classList.toggle("cursor-panning", interaction?.kind === "pan" || interaction?.kind === "pinch");
      }

      function zoomAt(screen, factor) {
        const nextScale = Math.min(8, Math.max(.15, scale * factor));
        const ratio = nextScale / scale;
        offsetX = screen.x - (screen.x - offsetX) * ratio;
        offsetY = screen.y - (screen.y - offsetY) * ratio;
        scale = nextScale;
        redraw();
        scheduleSave();
      }

      function pointerDown(event) {
        if (event.button !== undefined && event.button !== 0) return;
        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        const point = screenPoint(event);
        pointers.set(event.pointerId, point);

        if (pointers.size >= 2) {
          drawingPath = null;
          const pair = [...pointers.values()].slice(0, 2);
          const center = { x: (pair[0].x + pair[1].x) / 2, y: (pair[0].y + pair[1].y) / 2 };
          pinchState = { distance: Math.max(1, Math.hypot(pair[1].x - pair[0].x, pair[1].y - pair[0].y)) };
          interaction = { kind: "pinch", center };
          redraw();
          updateCursor();
          return;
        }

        if (currentTool === "pan" || spaceDown) {
          interaction = { kind: "pan", last: point };
        } else {
          const start = worldPoint(point);
          const tool = currentTool === "eraser" ? "eraser" : currentTool;
          drawingPath = { tool, color, lineWidth, points: [start] };
          interaction = { kind: "draw", pointerId: event.pointerId };
          redraw();
        }
        updateCursor();
      }

      function pointerMove(event) {
        if (!pointers.has(event.pointerId)) return;
        event.preventDefault();
        const point = screenPoint(event);
        pointers.set(event.pointerId, point);

        if (interaction?.kind === "pinch" && pointers.size >= 2) {
          const pair = [...pointers.values()].slice(0, 2);
          const distance = Math.max(1, Math.hypot(pair[1].x - pair[0].x, pair[1].y - pair[0].y));
          const center = { x: (pair[0].x + pair[1].x) / 2, y: (pair[0].y + pair[1].y) / 2 };
          zoomAt(center, distance / pinchState.distance);
          offsetX += center.x - interaction.center.x;
          offsetY += center.y - interaction.center.y;
          pinchState.distance = distance;
          interaction.center = center;
          redraw();
        } else if (interaction?.kind === "pan") {
          offsetX += point.x - interaction.last.x;
          offsetY += point.y - interaction.last.y;
          interaction.last = point;
          redraw();
        } else if (interaction?.kind === "draw" && drawingPath && interaction.pointerId === event.pointerId) {
          drawingPath.points.push(worldPoint(point));
          redraw();
        }
      }

      function pointerUp(event) {
        if (!pointers.has(event.pointerId)) return;
        event.preventDefault();
        pointers.delete(event.pointerId);

        if (interaction?.kind === "draw" && interaction.pointerId === event.pointerId && drawingPath) {
          paths.push(drawingPath);
          drawingPath = null;
          scheduleSave();
        }

        if (pointers.size < 2) pinchState = null;
        interaction = null;
        updateCursor();
        redraw();
      }

      function pointerCancel(event) {
        pointers.delete(event.pointerId);
        if (interaction?.kind === "draw" && interaction.pointerId === event.pointerId) drawingPath = null;
        pinchState = null;
        interaction = null;
        updateCursor();
        redraw();
      }

      toolButtons.forEach(button => {
        button.addEventListener("click", () => setActiveTool(button.dataset.tool));
      });

      colorButtons.forEach(button => {
        button.addEventListener("click", () => {
          color = button.dataset.color;
          colorButtons.forEach(item => item.classList.toggle("active", item === button));
          scheduleSave();
        });
      });

      widthInput.addEventListener("input", () => {
        lineWidth = Number(widthInput.value);
        widthValue.value = `${lineWidth} px`;
        scheduleSave();
      });

      gridToggle.addEventListener("change", () => {
        gridEnabled = gridToggle.checked;
        redraw();
        scheduleSave();
      });

      document.getElementById("undo-button").addEventListener("click", () => {
        if (paths.length) {
          paths.pop();
          redraw();
          scheduleSave();
        }
      });

      document.getElementById("clear-button").addEventListener("click", () => {
        if (!paths.length) return;
        if (window.confirm("確定要清除所有筆劃嗎？此操作無法復原。")) {
          paths = [];
          drawingPath = null;
          redraw();
          scheduleSave();
        }
      });

      document.getElementById("download-button").addEventListener("click", () => {
        canvas.toBlob(blob => {
          if (!blob) {
            setStatus("圖片匯出失敗，請再試一次。", true);
            return;
          }
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `課堂白板-${new Date().toISOString().slice(0, 10)}.png`;
          link.click();
          URL.revokeObjectURL(url);
          setStatus("已下載目前畫面 PNG。", true);
        }, "image/png");
      });

      document.getElementById("zoom-reset-button").addEventListener("click", () => {
        offsetX = 0;
        offsetY = 0;
        scale = 1;
        redraw();
        setStatus("視角已重設。", true);
      });

      document.getElementById("collapse-button").addEventListener("click", event => {
        const collapsed = toolbar.classList.toggle("collapsed");
        event.currentTarget.parentElement.classList.toggle("is-collapsed", collapsed);
        event.currentTarget.textContent = collapsed ? "›" : "‹";
        event.currentTarget.setAttribute("aria-label", collapsed ? "展開工具列" : "收合工具列");
        event.currentTarget.title = collapsed ? "展開工具列" : "收合工具列";
      });

      canvas.addEventListener("pointerdown", pointerDown);
      canvas.addEventListener("pointermove", pointerMove);
      canvas.addEventListener("pointerup", pointerUp);
      canvas.addEventListener("pointercancel", pointerCancel);
      canvas.addEventListener("lostpointercapture", pointerCancel);

      canvas.addEventListener("wheel", event => {
        event.preventDefault();
        const point = screenPoint(event);
        zoomAt(point, Math.exp(-event.deltaY * .0015));
      }, { passive: false });

      window.addEventListener("keydown", event => {
        const target = event.target;
        const editing = target instanceof HTMLElement &&
          (target.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName));
        if (event.code === "Space" && !editing && !event.repeat) {
          event.preventDefault();
          spaceDown = true;
          updateCursor();
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z" && !editing) {
          event.preventDefault();
          document.getElementById("undo-button").click();
        }
      });

      window.addEventListener("keyup", event => {
        if (event.code === "Space" && spaceDown) {
          spaceDown = false;
          updateCursor();
        }
      });

      window.addEventListener("blur", () => {
        if (spaceDown) {
          spaceDown = false;
          updateCursor();
        }
      });
      window.addEventListener("resize", resizeCanvas);

      loadState();
      toolButtons.forEach(button => button.classList.toggle("active", button.dataset.tool === currentTool));
      colorButtons.forEach(button => button.classList.toggle("active", button.dataset.color === color));
      widthInput.value = String(lineWidth);
      widthValue.value = `${lineWidth} px`;
      gridToggle.checked = gridEnabled;
      resizeCanvas();
    })();
  </script>
</body>
</html>
